name: Refresh and publish planner

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: |
            snapshot/
            raw/wiki/
            cache/art/
          key: planner-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: planner-data-
      - name: Run all tests
        run: |
          node --test tests/*.test.cjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Refresh data, compare sources, build both modes and validate
        run: python scripts/refresh_site.py
      - name: Cache the latest complete snapshots, wiki responses and art
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            snapshot/
            raw/wiki/
            cache/art/
          key: planner-data-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save source conflict reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-conflicts
          path: reports/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
